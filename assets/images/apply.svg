<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Scrambled development pathway challenge</title><desc id="d">Five unlabeled development cards float around a pathway workspace without revealing their correct order.</desc><rect width="900" height="500" fill="#dff1e9"/><text x="60" y="70" font-family="system-ui" font-size="28" font-weight="800" fill="#173238">BUILD THE DEVELOPMENT PATHWAY</text><text x="60" y="105" font-family="system-ui" font-size="18" fill="#587078">The milestones are mixed. Your job is to reconstruct the process.</text><path d="M95 350C210 255 275 405 390 310S580 245 805 330" fill="none" stroke="#91b7b0" stroke-width="10" stroke-dasharray="14 14"/><g stroke="#2f7975" stroke-width="5"><g transform="translate(145 220) rotate(-7)"><rect x="-70" y="-50" width="140" height="100" rx="18" fill="#fff"/><circle r="23" fill="#f4c765"/><path d="M-28 28h56" stroke="#173238"/></g><g transform="translate(320 180) rotate(5)"><rect x="-70" y="-50" width="140" height="100" rx="18" fill="#fff"/><path d="M-30 0h60M0-30v60" stroke="#d16c68" stroke-width="12"/></g><g transform="translate(500 230) rotate(-4)"><rect x="-70" y="-50" width="140" height="100" rx="18" fill="#fff"/><path d="M-35 15l35-35 35 35" fill="none" stroke="#377f8d" stroke-width="10"/></g><g transform="translate(675 175) rotate(7)"><rect x="-70" y="-50" width="140" height="100" rx="18" fill="#fff"/><path d="M-34 20h68M-22 0h44M-10-20h20" stroke="#7a6794" stroke-width="9"/></g><g transform="translate(760 330) rotate(-5)"><rect x="-70" y="-50" width="140" height="100" rx="18" fill="#fff"/><path d="M-30 0l20 20 40-45" fill="none" stroke="#2f7975" stroke-width="11"/></g></g><text x="60" y="455" font-family="system-ui" font-size="18" font-weight="700" fill="#173238">Observe • Develop • Translate • Test • Validate — but what comes first?</text></svg>