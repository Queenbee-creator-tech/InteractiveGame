<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Boa tooth structure and function diagram</title><desc id="d">A simplified close-up shows backward-curving boa teeth and arrows indicating how their recurved orientation can help resist prey pulling away.</desc><rect width="900" height="500" fill="#173f3c"/><rect x="45" y="45" width="810" height="410" rx="28" fill="#f7f1dc"/><text x="80" y="95" font-family="system-ui" font-size="28" font-weight="800" fill="#173238">NON-INVASIVE TOOTH SCAN</text><path d="M110 175q170-75 340 0" fill="none" stroke="#a97466" stroke-width="48" stroke-linecap="round"/><g fill="#fff9df" stroke="#6e5a45" stroke-width="5"><path d="M170 185q8 130 82 163-48-64-31-171z"/><path d="M265 164q16 143 96 171-57-62-44-177z"/><path d="M365 169q20 127 91 148-51-54-42-150z"/></g><path d="M565 250h180" stroke="#cf5c4e" stroke-width="12" stroke-linecap="round"/><path d="M725 225l45 25-45 25" fill="#cf5c4e"/><text x="565" y="205" font-family="system-ui" font-size="22" font-weight="700" fill="#173238">Prey pulls away</text><path d="M565 320h-145" stroke="#2f7975" stroke-width="12" stroke-linecap="round"/><path d="M440 295l-45 25 45 25" fill="#2f7975"/><text x="500" y="370" font-family="system-ui" font-size="22" font-weight="700" fill="#173238">Recurved teeth resist that direction</text><text x="80" y="425" font-family="system-ui" font-size="18" fill="#587078">Structure → function: backward curvature helps ensnare and retain prey.</text></svg>